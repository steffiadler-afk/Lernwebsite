<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Positive Emotions – Glücksrad</title>
  <link rel="stylesheet" href="wheel.css">
</head>
<body>
  <main class="wrap practice-shell emotions-page">
    <h1 lang="en">Positive Emotions</h1>
    <div class="emotions-board">
      <div class="emotion-wheel">
        <canvas id="emotion-wheel" width="1200" height="1200" role="img" aria-label="Glücksrad mit 15 englischen Adjektiven"></canvas>
        <span class="wheel-pointer" aria-hidden="true"></span>
      </div>
      <div class="emotions-play" lang="en">
        <button class="primary spin-button" id="spin-wheel" type="button" disabled>Spin the wheel</button>
        <div class="emotion-result" role="status" aria-atomic="true">
          <strong id="emotion-word">Ready?</strong>
          <span id="emotion-meaning" lang="de" hidden></span>
        </div>
        <p class="emotion-sentence">I feel … when …</p>
      </div>
    </div>
    <details class="emotion-vocabulary">
      <summary>Wortliste</summary>
      <ol id="emotion-vocabulary"></ol>
    </details>
    <noscript><p>Aktiviere JavaScript, um das Glücksrad zu drehen.</p></noscript>
  </main>
  <script type="module" src="wheel.js"></script>
</body>
</html>
