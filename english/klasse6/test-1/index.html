<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercises for Test 1 A & B – Klasse 6</title><link rel="stylesheet" href="../../../src/shared/styles.css">
<style>
main.wrap{max-width:860px}.tabs{display:flex;gap:12px;flex-wrap:wrap;margin:1.3rem 0}.tab,.opt,.restart{font:inherit;border:2px solid #b5c4d3;border-radius:10px;background:#fff;color:#203347;cursor:pointer;padding:.65rem .9rem;min-height:44px}.tab[aria-selected="true"]{background:#245f9a;color:white;border-color:#245f9a}.task{padding:1.2rem;border:1px solid #cbd5e1;border-radius:14px;margin:1.3rem 0;background:var(--surface,#fff)}.task h2{font-size:1.24rem;color:#23629b;margin:0 0 .4rem}.instruction{font-weight:500;margin:0 0 1rem}.question{padding:1rem 0;border-top:1px solid #dae0e6}.sentence{font-size:1.04rem;font-weight:600;line-height:1.55;margin:0 0 .65rem}.answers{display:flex;gap:.55rem;flex-wrap:wrap}.opt{font-weight:600;background:#f7fafc}.opt:disabled{cursor:default;opacity:1}.opt.good{background:#e2f4e9;border-color:#26804c;color:#176039}.opt.bad{background:#ffe9e9;border-color:#bb4949;color:#8c2e2e}.feedback{font-weight:600;margin:.6rem 0 0;min-height:1.1em}.feedback.good{color:#166534}.feedback.bad{color:#a42b2b}.score{border:1px solid #b4c3d0;padding:1rem;border-radius:12px;margin:1rem 0}.score strong{font-size:1.18rem}.mutedinfo{color:var(--muted,#516070)}@media(max-width:540px){.opt{flex:1 1 30%;padding:.7rem .3rem}}
</style></head><body><main class="wrap"><div class="topbar"><div><div class="brand">🇬🇧 Steffis Lernwerkstatt</div><div class="muted">Grammar · Klasse 6</div></div><div id="themeControls" class="controls"></div></div><p><a href="../index.html">← Englisch Klasse 6</a></p><h1>Exercises for Test 1</h1><p>Übe die englischen Zeitformen. Wähle bei jeder Lücke eine von drei Lösungen. Nach dem Anklicken siehst du sofort die Verbesserung. Jede richtige Antwort beim ersten Versuch gibt einen Punkt.</p><div class="tabs" role="tablist" aria-label="Test auswählen"><button class="tab" type="button" data-set="A" role="tab" aria-selected="true">Exercises for Test 1 A</button><button class="tab" type="button" data-set="B" role="tab" aria-selected="false">Exercises for Test 1 B</button></div><div class="score" role="status" aria-live="polite"><strong id="scoreText"></strong><p class="mutedinfo" id="finishText"></p><button class="restart" type="button" id="restart">Diesen Test neu starten</button></div><div id="exercises"></div><p><a href="../index.html">← Englisch Klasse 6</a></p></main><script type="module">
import {initPage} from '../../../src/shared/page.js';initPage();
const sets=[{"name":"A","groups":[["Exercise 1 – Simple Present","Setze die Verben im Simple Present ein. Wähle die richtige Form.",[["Emma ___ tennis every Friday. (play)","plays","play","played"],["My dad ___ coffee. (not / drink)","doesn't drink","don't drink","didn't drink"],["___ your sister ___ to school by bus? (go)","Does ... go","Do ... goes","Did ... go"],["We ___ in Regensburg. (live)","live","lives","lived"]]],["Exercise 2 – Simple Past","Setze die Verben im Simple Past ein. Achte auf Fragen und Verneinungen.",[["Yesterday Tom ___ his room. (clean)","cleaned","cleans","clean"],["Last Sunday I ___ my friend. (see)","saw","see","seen"],["We ___ to the park yesterday. (not / go)","didn't go","don't go","didn't went"],["___ you ___ your homework last night? (do)","Did ... do","Do ... do","Did ... did"]]],["Exercise 3 – Simple Present or Simple Past?","Entscheide zwischen Simple Present und Simple Past. Achte besonders auf die Signalwörter.",[["I ___ breakfast at seven every day. (have)","have","had","has"],["Last weekend we ___ a film. (watch)","watched","watch","watches"],["My brother ___ football on Mondays. (not / play)","doesn't play","didn't play","don't play"],["___ you ___ your grandma yesterday? (visit)","Did ... visit","Do ... visit","Did ... visited"],["They ___ to London two years ago. (travel)","travelled","travel","travels"]]],["Exercise 4 – Simple Present or Present Progressive?","Wähle die richtige Zeitform. Achte auf now, at the moment und every day.",[["Look! The cat ___ on the sofa. (sleep)","is sleeping","sleeps","slept"],["We ___ English every Tuesday. (learn)","learn","are learning","learned"],["She ___ TV at the moment. (not / watch)","isn't watching","doesn't watch","wasn't watching"],["___ they ___ basketball now? (play)","Are ... playing","Do ... play","Were ... playing"]]],["Exercise 5 – Past Progressive","Setze die Verben im Past Progressive ein.",[["At eight yesterday evening I ___ a book. (read)","was reading","were reading","read"],["The children ___ at six yesterday. (not / sleep)","weren't sleeping","wasn't sleeping","didn't sleep"],["___ he ___ a bike at 5 pm yesterday? (ride)","Was ... riding","Were ... riding","Did ... ride"],["My mum and dad ___ dinner at 7 pm yesterday. (cook)","were cooking","was cooking","cooked"]]]]},{"name":"B","groups":[["Exercise 1 – Simple Present","Setze die Verben im Simple Present ein. Wähle die richtige Form.",[["Ben ___ his bike to school every day. (ride)","rides","ride","rode"],["My friends ___ meat. (not / eat)","don't eat","doesn't eat","didn't eat"],["___ your dad ___ in an office? (work)","Does ... work","Do ... works","Did ... work"],["The dog ___ in the garden every morning. (run)","runs","run","ran"]]],["Exercise 2 – Simple Past","Setze die Verben im Simple Past ein. Achte auf Fragen und Verneinungen.",[["Last night Lisa ___ her grandma. (call)","called","calls","call"],["Yesterday we ___ pizza. (eat)","ate","eat","eated"],["He ___ his bag yesterday. (not / find)","didn't find","doesn't find","didn't found"],["___ they ___ the match last Saturday? (win)","Did ... win","Do ... win","Did ... won"]]],["Exercise 3 – Simple Present or Simple Past?","Entscheide zwischen Simple Present und Simple Past. Signalwörter helfen dir.",[["My sister ___ the piano every evening. (practise)","practises","practised","practise"],["Two days ago I ___ a new book. (buy)","bought","buy","buys"],["We ___ to school on Sundays. (not / go)","don't go","didn't go","doesn't go"],["___ he ___ breakfast yesterday morning? (eat)","Did ... eat","Does ... eat","Did ... ate"],["Last summer my cousins ___ us. (visit)","visited","visit","visits"]]],["Exercise 4 – Simple Present or Present Progressive?","Entscheide zwischen Gewohnheit und einer Handlung, die gerade passiert.",[["Listen! The birds ___ . (sing)","are singing","sing","sang"],["Dad ___ to work at eight every morning. (drive)","drives","is driving","drove"],["I ___ my shoes right now. (not / wear)","am not wearing","don't wear","wasn't wearing"],["___ she ___ her homework now? (do)","Is ... doing","Does ... do","Was ... doing"]]],["Exercise 5 – Past Progressive","Setze die Verben im Past Progressive ein.",[["Yesterday at six I ___ dinner. (make)","was making","were making","made"],["The boys ___ at 9 pm yesterday. (not / dance)","weren't dancing","wasn't dancing","didn't dance"],["___ you ___ a song at 4 pm yesterday? (sing)","Were ... singing","Was ... singing","Did ... sing"],["Mia ___ a picture at 3 pm yesterday. (draw)","was drawing","were drawing","drew"]]]]}];let current='A';const saved={A:{},B:{}};const root=document.getElementById('exercises');const score=document.getElementById('scoreText'),message=document.getElementById('finishText');
function update(){const n=Object.keys(saved[current]).length;const c=Object.values(saved[current]).filter(v=>v).length;score.textContent='Test 1 '+current+': '+c+' / 21 Punkte · '+n+' von 21 beantwortet';message.textContent=n===21?'Fertig! Du hast '+c+' von 21 Punkten erreicht. Du kannst den anderen Test bearbeiten oder neu beginnen.':'Beantworte alle 21 Fragen, um dein vollständiges Ergebnis zu sehen.'}
function render(){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.set===current)));root.replaceChildren();let idx=0;const test=sets.find(s=>s.name===current);
test.groups.forEach(([title,instruction,items])=>{const sect=document.createElement('section');sect.className='task';const h=document.createElement('h2');h.textContent=title+' · '+items.length+' Punkte';sect.append(h);const hint=document.createElement('p');hint.className='instruction';hint.textContent=instruction;sect.append(hint);
items.forEach(([sentence,answer,wrong1,wrong2],i)=>{const key=String(idx++),box=document.createElement('div');box.className='question';const line=document.createElement('p');line.className='sentence';line.textContent=(i+1)+'. '+sentence;box.append(line);const options=document.createElement('div');options.className='answers';const feedback=document.createElement('p');feedback.className='feedback';feedback.setAttribute('aria-live','polite');const variants=[answer,wrong1,wrong2]; // show varied correct-answer positions across questions
const shift=(Number(key)*2+ (current==='B'?1:0))%3;const ordered=variants.slice(shift).concat(variants.slice(0,shift));const buttons=[];
ordered.forEach(v=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=v;b.addEventListener('click',()=>{if(key in saved[current])return;const ok=v===answer;saved[current][key]=ok;paint(v);update()});buttons.push(b);options.append(b)});
function paint(chosen){buttons.forEach(b=>{b.disabled=true;if(b.textContent===answer)b.classList.add('good');else if(b.textContent===chosen)b.classList.add('bad')});const ok=chosen===answer;feedback.textContent=ok?'✓ Richtig!':'✗ Leider falsch. Richtige Lösung: '+answer;feedback.className='feedback '+(ok?'good':'bad')}
if(key in saved[current]){buttons.forEach(b=>{b.disabled=true;if(b.textContent===answer)b.classList.add('good')});feedback.textContent=saved[current][key]?'✓ Richtig!':'✗ Nicht richtig. Richtige Lösung: '+answer;feedback.className='feedback '+(saved[current][key]?'good':'bad')}
box.append(options,feedback);sect.append(box)});root.append(sect)});update()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.set;render()}));document.getElementById('restart').addEventListener('click',()=>{saved[current]={};render()});render();
</script></body></html>
