<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who is it?</title><link rel="stylesheet" href="../../../src/shared/styles.css"><style>.people-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}.person{min-height:145px;text-align:center}.avatar{font-size:3.2rem;display:block;margin-bottom:8px}.person.correct{outline:3px solid var(--good)}.person.wrong{outline:3px solid var(--bad)}.clue{font-size:1.1rem;font-weight:700}.writing{margin-top:24px}</style></head><body><main class="wrap"><div class="topbar"><div><div class="brand">Who is it?</div><div class="muted">Englisch · Klasse 6 · Describing people</div></div><div id="themeControls" class="controls"></div></div><div id="qr" class="qr"></div><p class="info">Read the description and click on the correct person.</p><div class="scorebar"><strong>Punkte: <span id="score">0</span>/<span id="total">8</span></strong><button class="primary" id="newBtn">Neue Runde</button></div><div id="exercise" class="exercise"><p id="roundLabel" class="muted"></p><p id="clue" class="clue"></p><div id="people" class="people-grid"></div></div><p id="result" class="result"></p><div class="exercise writing"><h3>Bonus task</h3><p>Choose one person and describe them in four sentences in your exercise book.</p></div><div id="submitBox"></div><p><a href="index.html">← Zurück zu Describing people</a></p></main><script type="module">import{initPage}from'../../../src/shared/page.js';import{protect}from'../../../src/shared/protect.js';import{mountQR}from'../../../src/shared/qr.js';import{Results}from'../../../src/shared/results.js';import{people,whoRounds}from'./describing_people_data.js';initPage();protect('english-6');mountQR();const clue=document.querySelector('#clue'),grid=document.querySelector('#people'),result=document.querySelector('#result'),scoreEl=document.querySelector('#score'),roundLabel=document.querySelector('#roundLabel');let order=[],round=0,score=0,details=[];function start(){order=[...whoRounds].sort(()=>Math.random()-.5);round=0;score=0;details=[];scoreEl.textContent='0';result.textContent='';render()}function render(){if(round>=order.length){result.textContent=score===order.length?'Alles richtig! 🎉':`${score} von ${order.length} richtig.`;result.className='result '+(score===order.length?'good':'bad');result.dataset.details=JSON.stringify(details);document.dispatchEvent(new CustomEvent('exercise:scored',{detail:{score,total:order.length,details}}));return}const r=order[round];roundLabel.textContent=`Round ${round+1} of ${order.length}`;clue.textContent=r.clue;grid.innerHTML=people.map(p=>`<button class="person" data-name="${p.name}"><span class="avatar" aria-hidden="true">${p.icon}</span><strong>${p.name}</strong></button>`).join('');grid.querySelectorAll('.person').forEach(b=>b.onclick=()=>choose(b,r))}function choose(btn,r){grid.querySelectorAll('button').forEach(b=>b.disabled=true);const got=btn.dataset.name,ok=got===r.answer;if(ok){score++;btn.classList.add('correct')}else{btn.classList.add('wrong');grid.querySelector(`[data-name="${r.answer}"]`)?.classList.add('correct');details.push({clue:r.clue,given:got,answer:r.answer})}scoreEl.textContent=score;setTimeout(()=>{round++;render()},700)}document.querySelector('#newBtn').onclick=start;Results.attachSubmit('#submitBox',{subject:'english',grade:6,topic:'describing-people',exercise:'who-is-it'});start();</script></body></html>
