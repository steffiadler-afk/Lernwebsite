<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch → Englisch – Unit 1</title><link rel="stylesheet" href="../../../src/shared/styles.css"></head><body><main class="wrap"><div class="topbar"><div><div class="brand">Deutsch → Englisch</div><div class="muted">Vocabulary Unit 1 · Klasse 6</div></div><div id="themeControls" class="controls"></div></div><p class="info">Schreibe zu jeder deutschen Bedeutung die passende englische Vokabel. Jede Runde enthält 12 zufällige Wörter.</p><div class="scorebar"><strong>Punkte: <span id="score">0</span>/<span id="total">12</span></strong><button class="primary" id="checkBtn">Prüfen</button><button id="newBtn">Neue Runde</button></div><div id="exercise" class="exercise"></div><p id="result" class="result"></p><div id="submitBox"></div><p><a href="index.html">← Zurück zu Vocabulary Unit 1</a></p></main><script type="module">import{initPage}from'../../../src/shared/page.js';import{Results}from'../../../src/shared/results.js';import{unit1Vocabulary}from'./unit1_vocab_data.js';initPage();const ex=document.querySelector('#exercise'),score=document.querySelector('#score'),result=document.querySelector('#result');let round=[];const norm=s=>String(s||'').trim().toLowerCase().replace(/^\(to\)\s*/,'').replace(/^to\s+/,'');const sample=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);function render(){round=sample(unit1Vocabulary,12);score.textContent='0';result.textContent='';result.dataset.details='null';ex.innerHTML=round.map((v,i)=>`<div class="row item"><span style="min-width:220px"><strong>${i+1}.</strong> ${v.de}</span><input data-i="${i}" type="text" autocomplete="off" placeholder="English"></div>`).join('')}function check(){let s=0,d=[];round.forEach((v,i)=>{const given=ex.querySelector(`[data-i="${i}"]`).value;if(norm(given)===norm(v.en))s++;else d.push({prompt:v.de,given,answer:v.en})});score.textContent=s;result.textContent=s===round.length?'Alles richtig! 🎉':`${s} von ${round.length} richtig.`;result.className='result '+(s===round.length?'good':'bad');result.dataset.details=JSON.stringify(d)}document.querySelector('#checkBtn').onclick=check;document.querySelector('#newBtn').onclick=render;render();Results.attachSubmit('#submitBox',{subject:'english',grade:6,topic:'vocabulary-unit1',exercise:'de-en'});</script></body></html>
